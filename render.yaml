services:
  - type: web
    name: drink-exchange
    runtime: node
    plan: free
    region: frankfurt
    branch: deploy
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: SIMULATOR_ENABLED
        value: "true"
      - key: SIMULATOR_INTERVAL_MS
        value: "5500"
